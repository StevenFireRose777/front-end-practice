<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="dice.css">
  <title>Dice Game</title>
</head>
<body>

  <header class="header-container">
    <h1>Welcome to dice game, 1 v 1. </h1>
    <p>Rules: Just click on the dice and the other dude would too.</p>
    <div class="input-container">
      <div class="name-container">
        <h1 class="player-head">player</h1>
        <h1 class="bot-head">bot</h1>
      </div>
      <span id="player-input">e</span>
      <span id="bot-input">p</span>
    </div>
    <button id="button-dice">Click to roll dice.</button>
  </header>



</body>
<script src="dice.js"></script>
</html>
